<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Missä tänään syötäisiin? Kuopion kampusravintoloiden lounas.">
<meta name="theme-color" content="#eef3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101612" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Syödään?">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Missä syötäisiin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
  /* Yksi näkymä kerrallaan: kysymys → (Tietoteknia: ruokalista | muut: krokotiili koko näytöllä) */
  :root {
    --bg: #eef3ec;
    --card: #ffffff;
    --ink: #17231a;
    --muted: #5d6b60;
    --line: #d5dfd3;
    --accent: #2f7d3a;
    --accent-ink: #ffffff;
    --price: #9a3412;
    --price-soft: #fbe9df;
    --font-display: "Bricolage Grotesque", ui-rounded, -apple-system, system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101612; --card: #18211b; --ink: #e8efe7; --muted: #95a597; --line: #2a362d;
      --accent: #5cbf6a; --accent-ink: #0b130d; --price: #fdba74; --price-soft: #3a2416;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101612; --card: #18211b; --ink: #e8efe7; --muted: #95a597; --line: #2a362d;
    --accent: #5cbf6a; --accent-ink: #0b130d; --price: #fdba74; --price-soft: #3a2416;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .view { min-height: 100%; padding-inline: 16px; padding-block: 24px; }
  .wrap { max-width: 440px; margin: 0 auto; }

  /* Kysymys */
  #ask { display: flex; align-items: center; }
  #ask .wrap { width: 100%; display: grid; gap: 28px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(34px, 10vw, 48px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 16px; }
  .choices { display: grid; gap: 12px; }
  .choice {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%;
    padding: 20px 20px;
    border: 2px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .choice::after { content: "→"; color: var(--muted); font-family: var(--font-body); }
  .choice:hover { border-color: var(--accent); }
  .choice:active { transform: scale(0.98); }
  .choice:focus-visible, .back:focus-visible, .retry:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* Krokotiili */
  #croc {
    position: fixed; inset: 0; z-index: 10;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .croc-box {
    position: relative;
    aspect-ratio: 1021 / 1540;
    height: min(100%, calc(100vw * 1540 / 1021));
    max-width: 100%;
    animation: chomp 0.45s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .croc-box img { display: block; width: 100%; height: 100%; }
  .retry {
    position: absolute;
    left: 50%; top: 72.5%;
    width: 17%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 0; border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  @keyframes chomp {
    from { transform: scale(0.6) rotate(-6deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .croc-box { animation: none; } }

  /* Ruokalista */
  .back {
    border: 0; background: none; padding: 6px 0; cursor: pointer;
    color: var(--accent); font: 600 16px var(--font-body);
  }
  h2 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 34px;
    line-height: 1.05;
    margin: 14px 0 4px;
    letter-spacing: -0.02em;
  }
  .meta { color: var(--muted); margin: 0 0 18px; font-variant-numeric: tabular-nums; }
  .menu {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .menu-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .menu-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .price {
    flex: none;
    font-size: 13px; font-weight: 700;
    color: var(--price); background: var(--price-soft);
    border-radius: 7px; padding: 2px 7px;
    font-variant-numeric: tabular-nums;
  }
  ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  li { overflow-wrap: anywhere; }
  li:first-child { font-weight: 600; font-size: 17px; }
  .tags { font-size: 12px; color: var(--muted); font-weight: 400; }
  .none { color: var(--muted); }
  .src { font-size: 12px; color: var(--muted); margin-top: 18px; }
  .src a { color: inherit; }
</style>
<style>
  .view { padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>

<section id="ask" class="view">
  <div class="wrap">
    <div>
      <h1>Missä tänään syötäisiin?</h1>
      <p class="hint">Paina ravintolaa, niin näet sen päivän ruokalistan.</p>
    </div>
    <div class="choices">
      <button class="choice" id="pick-tietoteknia" data-id="0439">Tietoteknia</button>
      <button class="choice" id="pick-canthia" data-id="0436">Canthia</button>
      <button class="choice" id="pick-snellmania" data-id="0437">Snellmania</button>
    </div>
  </div>
</section>

<section id="menu" class="view" hidden>
  <div class="wrap">
    <button class="back" id="back">← Takaisin</button>
    <h2>Tietoteknia</h2>
    <p class="meta" id="menu-meta"></p>
    <div id="menu-list"></div>
    <p class="src">Lähde: <a href="https://www.compass-group.fi/ravintolat-ja-ruokalistat/foodco/kaupungit/kuopio/tietoteknia/" target="_blank" rel="noopener">Compass Group</a>. Tarkista allergiat ravintolasta.</p>
  </div>
</section>

<div id="croc" hidden>
  <div class="croc-box">
    <img src="krokotiili.webp" alt="Vihainen krokotiili">
    <button class="retry" id="retry" aria-label="Yritä uudelleen"></button>
  </div>
</div>

<script src="menus.js?v=__VERSION__"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const WD = ["sunnuntai", "maanantai", "tiistai", "keskiviikko", "torstai", "perjantai", "lauantai"];
  const todayISO = new Date().toLocaleDateString("sv-SE");

  const show = name => {
    $("ask").hidden = name !== "ask";
    $("menu").hidden = name !== "menu";
    $("croc").hidden = name !== "croc";
    window.scrollTo(0, 0);
  };

  const el = (tag, cls, ...kids) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    n.append(...kids.filter(k => k != null));
    return n;
  };

  const parseItem = s => {
    const m = s.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
    if (!m) return { text: s, tags: "" };
    return { text: m[1], tags: m[2].split(",").map(t => t.trim()).filter(t => t && t !== "*").join(" ") };
  };

  const fmtDate = iso => {
    const d = new Date(iso + "T12:00:00");
    return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`;
  };

  function renderMenu() {
    const r = (window.MENUS?.restaurants || []).find(x => x.id === "0439");
    const days = (r?.days || []).filter(d => d.date >= todayISO && d.menus.length);
    const day = days[0];
    const list = $("menu-list");
    if (!day) {
      $("menu-meta").textContent = "";
      list.replaceChildren(el("p", "none", "Ruokalistaa ei ole vielä julkaistu."));
      return;
    }
    const when = day.date === todayISO ? "Tänään" : `Ei lounasta tänään. Seuraavaksi ${fmtDate(day.date)}`;
    $("menu-meta").textContent = [when + (day.date === todayISO ? `, ${fmtDate(day.date)}` : ""), day.hours]
      .filter(Boolean).join(" · ");
    list.replaceChildren(...day.menus.map(m => {
      const price = (m.price || "").match(/Op\s*([\d,]+)\s*€/i);
      return el("div", "menu",
        el("div", "menu-top", el("span", "menu-name", m.name), price ? el("span", "price", price[1] + " €") : null),
        el("ul", null, ...m.items.map(parseItem).map(i =>
          el("li", null, i.text, " ", i.tags ? el("span", "tags", i.tags) : null)))
      );
    }));
  }

  document.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => {
    if (btn.dataset.id === "0439") { renderMenu(); show("menu"); }
    else show("croc");
  }));
  $("retry").addEventListener("click", () => show("ask"));
  $("back").addEventListener("click", () => show("ask"));

  // Kotinäytöltä avattu sovellus voi jäädä muistiin päiviksi: ladataan uudelleen,
  // kun se palaa näkyviin ja viimeisestä latauksesta on yli tunti.
  const loadedAt = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - loadedAt > 60 * 60 * 1000) location.reload();
  });
})();
</script>
</body>
</html>
